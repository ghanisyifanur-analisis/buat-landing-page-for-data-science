version: '3.8'

services:
  ds-model-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dataval-inference-api
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - MODEL_VERSION=2.4.1
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
